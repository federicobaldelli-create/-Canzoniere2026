name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Scompatta il progetto Android
        shell: bash
        run: |
          unzip -o Canzoniere2026_Android.zip -d progetto

          echo "Struttura del progetto:"
          find progetto -maxdepth 4 -type f | sort

      - name: Trova progetto Android
        id: find_project
        shell: bash
        run: |
          SETTINGS=$(find progetto -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRORE: settings.gradle non trovato dopo l'estrazione."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Progetto Android trovato in:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Compila APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.find_project.outputs.project_dir }}"

          echo "Compilazione da:"
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

          gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: Canzoniere-2026-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
