name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Trova progetto Android
        id: android_project
        shell: bash
        run: |
          PROJECT_DIR=$(dirname "$(find . -name settings.gradle -type f -print -quit)")
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Compila APK
        shell: bash
        run: |
          cd "${{ steps.android_project.outputs.project_dir }}"
          gradle :app:assembleDebug --no-daemon

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: Canzoniere-2026-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
